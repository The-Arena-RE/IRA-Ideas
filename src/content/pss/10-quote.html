<section id="ps9-quote" class="ps9-section">
<style>
.e-con:has(#ps9-quote),.e-con-inner:has(#ps9-quote),.elementor-section:has(#ps9-quote) .elementor-widget-wrap{--gap:0px!important;--row-gap:0px!important;--column-gap:0px!important;--widgets-spacing:0px!important;--widgets-spacing-row:0px!important;--padding-top:0px!important;--padding-bottom:0px!important;--padding-left:0px!important;--padding-right:0px!important;gap:0!important;padding:0!important}
.elementor-widget-html:has(#ps9-quote){margin:0!important;padding:0!important;--kit-widget-spacing:0px!important}
.elementor-widget-html:has(#ps9-quote) > .elementor-widget-container{margin:0!important;padding:0!important}

#ps9-quote{--ps9-gold:#c9a45c;--ps9-gold2:#e4c98f;--ps9-muted:#9a958b;--ps9-line:rgba(255,255,255,.10);
  --ps9-serif:'Playfair Display',Georgia,'Times New Roman',serif;--ps9-sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  display:block;width:100%;max-width:none;margin:0;position:relative;overflow:hidden;
  font-family:var(--ps9-sans);font-size:16px;line-height:1.6;color:#e9e6e0;text-align:left;-webkit-font-smoothing:antialiased;
  padding:60px 0;background:radial-gradient(700px 300px at 10% 50%,rgba(201,164,92,.14),transparent 70%),radial-gradient(500px 260px at 95% 50%,rgba(201,164,92,.08),transparent 70%),#0b0b0c}
#ps9-quote *,#ps9-quote *::before,#ps9-quote *::after{box-sizing:border-box}
#ps9-quote p,#ps9-quote blockquote,#ps9-quote figure,#ps9-quote figcaption{margin:0;padding:0;border:0}
#ps9-quote a{text-decoration:none;box-shadow:none}
#ps9-quote :focus-visible{outline:2px solid var(--ps9-gold);outline-offset:3px}

#ps9-quote .ps9-wrap{max-width:1406px;margin:0 auto;padding:0 28px}
#ps9-quote .ps9-band{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:36px;padding:34px 40px;border:1px solid rgba(201,164,92,.35);border-radius:20px;background:linear-gradient(120deg,rgba(201,164,92,.08),rgba(255,255,255,.015) 45%,rgba(201,164,92,.05));position:relative}
#ps9-quote .ps9-mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e2c283,#c9a45c 50%,#a9843f);color:#15120c;box-shadow:0 14px 30px -14px rgba(201,164,92,.7)}
#ps9-quote .ps9-mark svg{width:28px;height:28px}
#ps9-quote blockquote{font-family:var(--ps9-serif)!important;font-style:italic;font-weight:500;font-size:32px;line-height:1.25;color:#fff;letter-spacing:-.005em}
#ps9-quote blockquote span{color:var(--ps9-gold2)}
#ps9-quote figcaption{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--ps9-muted)}
#ps9-quote figcaption::before{content:"";width:24px;height:1px;background:var(--ps9-gold)}
#ps9-quote figcaption b{color:#e9e6e0;font-weight:600}
#ps9-quote .ps9-cta{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-left:36px;border-left:1px solid var(--ps9-line)}
#ps9-quote .ps9-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:17px 28px;border-radius:9px;font-family:var(--ps9-sans);font-size:15px;font-weight:600;line-height:1.2;white-space:nowrap;background:linear-gradient(135deg,#e2c283 0%,#c9a45c 48%,#a9843f 100%);color:#15120c!important;box-shadow:0 12px 30px -12px rgba(201,164,92,.7);transition:transform .2s ease,box-shadow .2s ease}
#ps9-quote .ps9-btn:hover{transform:translateY(-1px);box-shadow:0 18px 38px -12px rgba(201,164,92,.85)}
#ps9-quote .ps9-btn svg{width:16px;height:16px;transition:transform .2s ease}
#ps9-quote .ps9-btn:hover svg{transform:translateX(3px)}
#ps9-quote .ps9-price{font-size:12.5px;color:var(--ps9-muted);white-space:nowrap}
#ps9-quote .ps9-price b{color:var(--ps9-gold2);font-weight:600}

@media (max-width:1024px){
  #ps9-quote .ps9-band{grid-template-columns:auto 1fr;gap:24px 28px}
  #ps9-quote .ps9-cta{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;padding:20px 0 0;border-left:0;border-top:1px solid var(--ps9-line)}
  #ps9-quote blockquote{font-size:28px}
}
@media (max-width:767px){
  #ps9-quote{padding:30px 0}
  #ps9-quote .ps9-wrap{padding:0 20px}
  #ps9-quote .ps9-band{grid-template-columns:1fr;gap:16px;padding:26px 22px;border-radius:16px;text-align:left}
  #ps9-quote .ps9-mark{width:48px;height:48px}
  #ps9-quote .ps9-mark svg{width:21px;height:21px}
  #ps9-quote blockquote{font-size:23px}
  #ps9-quote .ps9-cta{flex-direction:column;align-items:stretch;gap:10px;padding-top:16px}
  #ps9-quote .ps9-btn{width:100%;white-space:normal}
  #ps9-quote .ps9-price{text-align:center}
}
@media (prefers-reduced-motion:reduce){#ps9-quote *{transition:none!important}}
</style>
<div class="ps9-wrap">
  <figure class="ps9-band">
    <div class="ps9-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M13 8C7.5 9.5 4 13.6 4 19.2V24h9v-9H8.4c.4-2.8 2.2-4.8 5.1-5.8L13 8zm15 0c-5.5 1.5-9 5.6-9 11.2V24h9v-9h-4.6c.4-2.8 2.2-4.8 5.1-5.8L28 8z"/></svg></div>
    <div>
      <blockquote>&ldquo;Tim is an attorney who <span>other attorneys go to for help.&rdquo;</span></blockquote>
      <figcaption><b>Bryce</b> · Practicing attorney, client review</figcaption>
    </div>
    <div class="ps9-cta">
      <a href="#pss-booking" class="ps9-btn" data-pss-cta="standard">Book Your Strategy Session <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
     <p class="ps9-price">Tax Academy members <b>$650</b> · Standard <b>$950</b></p>
    </div>
  </figure>
</div>
</section>
